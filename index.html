<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacaciones Diciembre 🎄🎅</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f1f5f9;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #e2e8f0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        .tree-container {
            margin: 0 auto 10px auto;
            position: relative;
            width: 200px;
            height: 270px;
        }
        .percent-text {
            font-size: 2.2rem;
            font-weight: bold;
            color: #4ade80;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }
        .target-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #cbd5e1;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }
        .teams-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .team-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px 20px;
            width: 180px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .team-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }
        .team-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #94a3b8;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .team-stats {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }
        .team-label {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .progress-bar-bg {
            background: #334155;
            height: 6px;
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: #4ade80;
            height: 100%;
            border-radius: 3px;
            transition: width 1s ease-in-out;
        }
    </style>
</head>
<body>

    <h1>Vacaciones Diciembre 🎄🎅</h1>

    <!-- Árbol de Navidad Animado -->
    <div class="tree-container">
        <svg width="200" height="270" viewBox="0 0 200 270">
            <defs>
                <clipPath id="treeClip">
                    <path d="M100 25 L125 80 L110 80 L135 135 L115 135 L150 210 L110 210 L110 260 L90 260 L90 210 L50 210 L85 135 L65 135 L90 80 L75 80 Z" />
                </clipPath>
            </defs>
            <path d="M100 25 L125 80 L110 80 L135 135 L115 135 L150 210 L110 210 L110 260 L90 260 L90 210 L50 210 L85 135 L65 135 L90 80 L75 80 Z" fill="#334155" />
            <rect id="treeFill" x="0" y="260" width="200" height="0" fill="#16a34a" clip-path="url(#treeClip)" style="transition: height 1.5s ease-in-out, y 1.5s ease-in-out;" />
            <polygon id="star" points="100,0 103,9 111,9 104,14 107,22 100,17 93,22 96,14 89,9 97,9" fill="#475569" style="transition: fill 1s ease;" />
        </svg>
    </div>

    <div class="percent-text" id="percent-text">Cargando...</div>
    <div class="target-number">Meta Total: 1800</div>

    <!-- Cuadros de los Equipos -->
    <div class="teams-grid" id="teams-container"></div>

    <script>
        // Enlace ya corregido al formato CSV
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSfXQNcRKFTsyf4i5dmtN1GIyuU2N6Jr55mEHwq69xQhRazgIqCeCbWAgq_2ccpUncuQnPRcsc0K6xH/pub?output=csv';

        // Diccionario de apodos
        const apodos = {
            "Alejandra de la Cruz Jimenez": "Ale de la Cruz",
            "Daniel Alejandro Jimenez Ventura": "Daniel",
            "Gabriela Capul": "Gaby",
            "Hector Manuel Montaño": "Hector",
            "Jose de Jesus Hernandez Hernandez": "Jesus",
            "Norma Alejandra Ruiz Diaz": "Ale Ruiz",
            "Roberto Ivan Lopez Diaz": "Roberto",
            "Rodolfo Perez Martinez": "Rodolfo",
            "Vania Nayeli Garcia Ante": "Vania",
            "Ximena Garcia Juarez": "Xim",
            "Ismael Pérez Alatorre": "Ismael",
            "Team Toluca": "Toluca"
        };

        async function loadData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`${CSV_URL}&t=${timestamp}`);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.text();
                
                // Procesador CSV corregido para no cortar los espacios
                const rows = data.split('\\n').map(row => row.split(',').map(item => item.replace(/(^"|"$)/g, '').trim()));
                
                let totalDFTs = 0;
                let totalMetaNacional = 0;
                
                const teamsContainer = document.getElementById('teams-container');
                teamsContainer.innerHTML = '';
                
                for (let i = 1; i < rows.length; i++) {
                    const rowData = rows[i];
                    
                    if(!rowData || rowData.length < 4) continue;
                    
                    const equipoOriginal = rowData[0] ? rowData[0].trim() : '';
                    const dfts = parseInt(rowData[1]) || 0;
                    const metaEquipo = parseInt(rowData[2]) || 0;
                    const metaPeriodo = parseInt(rowData[3]) || 0;
                    
                    if(equipoOriginal === '' || metaPeriodo === 0) continue;

                    totalDFTs += dfts;
                    totalMetaNacional += metaPeriodo;
                    
                    const equipoPercentRaw = metaEquipo > 0 ? (dfts / metaEquipo) : 0;
                    const equipoPercent = Math.min(equipoPercentRaw * 100, 100);
                    
                    // Traducción automática del nombre
                    const equipoMostrar = apodos[equipoOriginal] || equipoOriginal;
                    
                    const card = document.createElement('div');
                    card.className = 'team-card';
                    card.innerHTML = `
                        <div class="team-name">${equipoMostrar}</div>
                        <div class="team-stats">${dfts} / ${metaEquipo}</div>
                        <div class="team-label">DFTs / Meta</div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${equipoPercent}%;"></div>
                        </div>
                    `;
                    teamsContainer.appendChild(card);
                }
                
                const rawPercent = totalMetaNacional > 0 ? (totalDFTs / totalMetaNacional) : 0;
                const percent = Math.min(rawPercent, 1);
                
                const maxHeight = 235;
                const bottomY = 260;
                
                const fillHeight = maxHeight * percent;
                const fillY = bottomY - fillHeight;
                
                document.getElementById('treeFill').setAttribute('height', fillHeight);
                document.getElementById('treeFill').setAttribute('y', fillY);
                document.getElementById('percent-text').innerText = (rawPercent * 100).toFixed(1) + '%';
                
                if (rawPercent >= 1) {
                    document.getElementById('star').setAttribute('fill', '#FFD700'); 
                }
                
            } catch(err) {
                console.error("Error al cargar los datos:", err);
                document.getElementById('teams-container').innerHTML = `
                    <div style="width: 100%; color: #ef4444; padding: 20px; background: rgba(239,68,68,0.1); border-radius: 8px;">
                        No se pudieron cargar los datos. Revisa que pegaste el enlace CSV de tu archivo personal.
                    </div>`;
            }
        }

        loadData();
        setInterval(loadData, 180000);
    </script>
</body>
</html>
